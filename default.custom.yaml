patch:
  schema_list:
    - schema: luna_pinyin_simp
    - schema: kokomi_flypy
  menu/page_size: 7
  switcher/hotkeys:
    - "Control+Shift+F5"
  switcher/save_options/+:
    - emoji_suggestion
    - tone_display

  # 输入状态切换
  # https://gist.github.com/lotem/2981316
  ascii_composer:
    # CapsLock 键作为输入法切换键
    good_old_caps_lock: false
    switch_key:
      # librime v1.14.0 带来了 set/unset_ascii_mode, 能实现模式按键
      # 当前小狼毫还没发布新版，但可以去 librime 下载 rime-e053fb2-Windows-msvc-x64.7z
      # 替换小狼毫使用的 DDL 文件引入新功能
      Caps_Lock: commit_code # 已输入字符上屏，同时切换模式
      Shift_L: noop
      Shift_R: noop
      Control_L: noop # 已输入字符上屏，同时切换模式
      Control_R: noop

  # 注意需要在特定配置中使用 import_preset: default 才能生效
  key_binder:
    bindings:
      # 长按 Shift 切换到英文状态，为避免和快捷键冲突使用右侧按键
      - { when: always, accept: Shift+Shift_R, set_option: ascii_mode }
      # 实践中每次使用 Shift 输入大写开头的字符时，都会想要输入一串英文
      # - { when: always, accept: Shift+Shift_L, set_option: ascii_mode }
      # 长按 Control 切换到中文状态
      - { when: always, accept: Control+Control_R, unset_option: ascii_mode }
      # Alt 无法被捕获
      # - { when: always, accept: Alt+Alt_R, unset_option: ascii_mode }

      # Vim like keybindings from default preset
      - { when: composing, accept: "Control+p", send: Up }
      - { when: composing, accept: "Control+n", send: Down }
      - { when: composing, accept: "Control+b", send: Left }
      - { when: composing, accept: "Control+f", send: Right }
      - { when: composing, accept: "Control+a", send: Home }
      - { when: composing, accept: "Control+e", send: End }
      - { when: composing, accept: "Control+d", send: Delete }
      - { when: composing, accept: "Control+k", send: "Shift+Delete" }
      - { when: composing, accept: "Control+h", send: BackSpace }
      - { when: composing, accept: "Control+g", send: Escape }
      # 翻页控制
      - { when: has_menu, accept: minus, send: Page_Up }
      - { when: has_menu, accept: equal, send: Page_Down }
      - { when: paging, accept: bracketleft, send: Page_Up }
      - { when: has_menu, accept: bracketright, send: Page_Down }
      # 输入状态切换
      # - { when: always, accept: "Control+Shift+exclam", select: .next }
      # - { when: always, accept: "Control+Shift+at", toggle: ascii_mode }
      # - { when: always, accept: "Control+Shift+numbersign", toggle: full_shape }
      # - { when: always, accept: "Control+Shift+dollar", toggle: simplification }
