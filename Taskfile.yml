version: 3

vars:
  gh_proxy: "https://gh-proxy.com/"

tasks:
  download-assets:
    desc: 从互联网下载词典等大型资源
    deps:
      - download-wanxiang
      - download-ice
      - download-moegirl
      - download-sogou

  download-wanxiang:
    desc: 下载万象词库.
    cmds:
      - wget --continue {{ .gh_proxy }}/https://github.com/amzxyz/RIME-LMDG/releases/download/LTS/wanxiang-lts-zh-hans.gram
      - wget --continue {{ .gh_proxy }}/https://github.com/amzxyz/RIME-LMDG/releases/download/dict-nightly/dicts.zip
      - 7z e dicts.zip -aoa -odicts/wanxiang -- '*/base*' '*/c*'
      - rm dicts.zip

  download-ice:
    desc: 下载白霜拼音词库
    cmds:
      - wget --continue --directory-prefix=dicts/rime_ice/ {{ .gh_proxy }}/https://github.com/gaboolic/rime-frost/blob/master/en_dicts/en.dict.yaml
      - wget --continue --directory-prefix=dicts/rime_ice/ {{ .gh_proxy }}/https://github.com/gaboolic/rime-frost/blob/master/en_dicts/en_ext.dict.yaml

  download-moegirl:
    desc: 下载萌娘百科词库
    cmds:
      - wget --continue {{ .gh_proxy }}/https://github.com/outloudvi/mw2fcitx/releases/download/20250810/moegirl.dict.yaml --directory-prefix=dicts/

  download-sogou:
    desc: 下载搜狗词库
    cmds:
      - wget --continue "https://pinyin.sogou.com/d/dict/download_cell.php?id=4&name=%E7%BD%91%E7%BB%9C%E6%B5%81%E8%A1%8C%E6%96%B0%E8%AF%8D&f=detail" -O 网络流行新词.scel
      - wget --continue {{ .gh_proxy }}/https://github.com/studyzy/imewlconverter/releases/download/v3.2.0/imewlconverter_Windows.zip
      - 7z e imewlconverter_Windows.zip -aoa -oimewlconverter
      - rm imewlconverter_Windows.zip
      - ./imewlconverter/深蓝词库转换.exe -i:scel 网络流行新词.scel -o:rime 网络流行新词.txt
      - |
        bat << EOF > net-header.txt
        # Rime dictionary
        # encoding: utf-8
        # code: tabSize=32 insertSpaces=false
        # source: https://pinyin.sogou.com/dict/detail/index/4
        ---
        name: net
        version: "0"
        sort: by_weight
        ...
        EOF
      - mkdir dicts/sogou
      - bat net-header.txt 网络流行新词.txt > dicts/sogou/net.dict.yaml
      - rm 网络流行新词.scel net-header.txt 网络流行新词.txt
      - rm -rf imewlconverter

  download-emoji:
    desc: 下载表情词库
    cmds:
      - wget --continue --directory-prefix=opencc {{ .gh_proxy }}/https://github.com/Mintimate/oh-my-rime/blob/main/opencc/emoji.txt
      - wget --continue --directory-prefix=opencc {{ .gh_proxy }}/https://github.com/Mintimate/oh-my-rime/blob/main/opencc/others.txt
      - wget --continue --directory-prefix=opencc {{ .gh_proxy }}/https://github.com/Mintimate/oh-my-rime/blob/main/opencc/spoken.txt
